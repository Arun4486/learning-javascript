<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom_manipulation</title>
</head>
<body style="background-color: #212121; color: white;">
    <ul class="language">
        <li>
            Javascript
        </li>
    </ul>
</body>
<script>
    function addlang(langName){
        const li = document.createElement("li");
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li);
    }
    addlang("Python")
    addlang("Cpp") // it iterates all the dom tree then append new child

    //OR optimized approach, for example directly giving the index for an specific element

    function addOptiLang(langName){
        const li = document.createElement('li'); 
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOptiLang("TypeScript");

    // Editing values
    const secondLang = document.querySelector("li:nth-child(2)");
    // secondLang.innerHTML = "JAVA" // works

    // OR
    const newLi = document.createElement('li');
    newLi.textContent = "java"
    secondLang.replaceWith(newLi)

    // for first element
    const firstLang = document.querySelector("li:first-child");
    // firstLang.outerHTML = '<li>Typing...</li>';

    // remove

    const lastLang = document.querySelector('li:last-child');
    // console.log(lastLang); // li Typescript
    lastLang.remove() // removed    
</script>
</html>
